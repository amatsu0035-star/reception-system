<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- iPad等でのピンチズームやダブルタップズームを無効化し、操作性を安定させる -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>来賓受付システム</title>
    <!-- 視認性の高いNoto Sans JPフォントを読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* 全体のリセットと基本設定 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: 'Noto Sans JP', sans-serif;
            background-color: #FFFFFF;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s ease;
            /* 画面全体の意図しないテキスト選択を防止 */
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- 状態別の背景色設定 --- */
        body.status-error { background-color: #FF0000; color: #FFFFFF; }
        body.status-success { background-color: #00FF00; color: #000000; }
        body.status-warning { background-color: #FFFF00; color: #000000; }

        .container {
            width: 95%;
            max-width: 1000px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .hidden { display: none !important; }

        /* --- 入力エリアのスタイル --- */
        #input-area label {
            display: block;
            font-size: clamp(28px, 4vh, 48px);
            font-weight: 700;
            margin-bottom: clamp(12px, 2vh, 24px);
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            font-size: clamp(40px, 6vh, 64px);
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: 700;
            padding: clamp(16px, 2.5vh, 24px);
            margin-bottom: clamp(24px, 4vh, 56px);
            border: 6px solid #000000;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
            background-color: #FFFFFF;
            color: #000000;
            user-select: auto;
            -webkit-user-select: auto;
        }
        input::placeholder { color: #888888; font-weight: 400; font-size: clamp(32px, 4vh, 48px); }
        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            box-shadow: 0 0 0 8px rgba(0, 0, 0, 0.2);
        }

        /* --- カウンターUIのスタイル --- */
        .counter-ui {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: clamp(24px, 4vh, 56px);
        }
        .btn-counter {
            font-size: clamp(40px, 6vh, 64px);
            width: clamp(64px, 10vw, 100px);
            height: clamp(64px, 10vw, 100px);
            border-radius: 50%;
            border: 6px solid #000000;
            background-color: #FFFFFF;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            min-width: 0;
            margin-bottom: 0;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .btn-counter:active {
            transform: scale(0.95);
        }
        .counter-ui input[type="number"] {
            width: clamp(120px, 20vw, 180px);
            margin-bottom: 0;
        }

        /* --- ボタンの共通スタイル --- */
        .button-group {
            display: flex;
            justify-content: center;
            gap: clamp(24px, 4vw, 64px);
            flex-wrap: wrap;
        }
        button {
            font-family: 'Noto Sans JP', sans-serif;
            font-size: clamp(32px, 4.5vh, 48px);
            font-weight: 700;
            padding: clamp(20px, 3vh, 32px) clamp(32px, 5vw, 64px);
            border-radius: 16px;
            cursor: pointer;
            min-width: 280px;
            border: 6px solid #000000;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-black { background-color: #000000; color: #FFFFFF; }
        .btn-white { background-color: #FFFFFF; color: #000000; }
        
        body.status-error .btn-white { color: #000000; }

        /* --- 結果表示エリアのスタイル --- */
        #result-area { width: 100%; }

        .result-message {
            font-size: clamp(48px, 8vh, 80px);
            font-weight: 700;
            margin-bottom: clamp(24px, 4vh, 48px);
        }

        /* ゲスト情報表示用のカードデザイン */
        .guest-info-card {
            background-color: #FFFFFF;
            color: #000000;
            border: 6px solid #000000;
            border-radius: 16px;
            padding: clamp(24px, 4vh, 40px);
            text-align: left;
            margin-bottom: clamp(24px, 4vh, 48px);
            box-shadow: 12px 12px 0px rgba(0,0,0,0.15);
        }

        .info-row {
            font-size: clamp(32px, 4.5vh, 40px);
            margin-bottom: clamp(16px, 2.5vh, 24px);
            word-break: break-all;
        }
        .info-label {
            font-size: clamp(20px, 3vh, 28px);
            color: #555555;
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .customer-name {
            font-size: clamp(48px, 7vh, 64px);
            font-weight: 700;
            border-bottom: 4px solid #000000;
            padding-bottom: 16px;
            margin-bottom: clamp(20px, 3vh, 32px);
        }
        .customer-name-suffix {
            font-size: clamp(32px, 4.5vh, 40px);
            font-weight: normal;
        }

        /* --- ローディング表示 --- */
        #loading {
            font-size: clamp(40px, 6vh, 64px);
            font-weight: 700;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #000000;
        }


        .btn-ocr {
            font-size: clamp(28px, 4vh, 40px);
            padding: clamp(16px, 2vh, 24px) clamp(24px, 4vw, 48px);
            border-radius: 16px;
            color: #FFFFFF;
            border: 6px solid #000000;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }
        .btn-ocr:active {
            transform: scale(0.98);
        }
        .btn-scan { background-color: #2196F3; margin-bottom: 0; }
        .camera-button-container {
            display: flex;
            gap: 16px;
            margin-bottom: clamp(16px, 3vh, 32px);
            flex-direction: column; /* スマホ等では縦並び */
        }
        @media (min-width: 600px) {
            .camera-button-container {
                flex-direction: row; /* タブレット以上では横並び */
            }
        }

        /* --- リアルタイムスキャナーUI --- */
        #scanner-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #live-video {
            width: 100%;
            max-height: 80vh;
            object-fit: cover;
        }
        .scan-guide {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 500px;
            height: 120px;
            border: 6px solid #00FF00;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
            pointer-events: none;
            box-sizing: border-box;
            border-radius: 12px;
        }
        .scanner-controls {
            position: absolute;
            bottom: clamp(20px, 4vh, 40px);
            width: 100%;
            display: flex;
            justify-content: center;
        }
        .btn-cancel-scan {
            background-color: #FF3B30;
            color: white;
            border: 4px solid #FFFFFF;
            font-size: clamp(24px, 3.5vh, 36px);
            padding: 16px 40px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .scan-status {
            position: absolute;
            top: clamp(20px, 4vh, 40px);
            color: #FFFFFF;
            font-size: clamp(20px, 3vh, 32px);
            font-weight: bold;
            text-align: center;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
            z-index: 10001;
        }
    </style>
</head>
<body>

    <div id="loading" class="hidden">処理中...</div>

    <!-- ================= リアルタイムスキャナーUI ================= -->
    <div id="scanner-container" class="hidden">
        <div class="scan-status" id="scan-status-text">キー番号を枠に合わせて「読み取り」を押してください</div>
        <div id="live-ocr-result" class="hidden" style="color: #00FF00; font-size: clamp(32px, 5vh, 48px); font-weight: bold; text-align: center; position: absolute; top: clamp(80px, 12vh, 160px); width: 100%; z-index: 10001; text-shadow: 2px 2px 4px #000; background: rgba(0,0,0,0.5); padding: 10px 0;" data-text="">認識結果: (未検出)</div>
        <div style="position: relative; width: 100%; overflow: hidden; display: flex; justify-content: center;">
            <video id="live-video" autoplay playsinline></video>
            <div class="scan-guide" id="scan-guide-box"></div>
        </div>
        <div class="scanner-controls">
            <button type="button" class="btn-cancel-scan" onclick="closeLiveScanner()">キャンセル</button>
            <button type="button" id="btn-capture-scan" class="btn-cancel-scan" style="background-color: #4CAF50; margin-left: 16px;" onclick="captureAndAnalyze()">読み取り</button>
        </div>
        <canvas id="scan-canvas" class="hidden"></canvas>
    </div>

    <div class="container">
        <!-- ================= 入力エリア ================= -->
        <div id="input-area">
            <form onsubmit="handleReception(event);">
                <label for="key-number">キー番号</label>
                <div class="camera-button-container">
                    <button type="button" class="btn-ocr btn-scan" onclick="openScanner()">📷 カメラで読み取り</button>
                </div>
                <input type="file" accept="image/*" capture="environment" id="camera-file-input" class="hidden" onchange="handleImageCapture(event)">
                <input type="text" id="key-number" name="key-number" placeholder="入力または読み取り" autocomplete="off">
                
                <label for="companion-count">同伴者</label>
                <div class="counter-ui">
                    <button type="button" class="btn-counter" onclick="adjustCount('companion-count', -1)">-</button>
                    <input type="number" id="companion-count" name="companion-count" value="0" min="0" autocomplete="off" readonly>
                    <button type="button" class="btn-counter" onclick="adjustCount('companion-count', 1)">+</button>
                </div>
                
                <label for="child-count">お子様</label>
                <div class="counter-ui">
                    <button type="button" class="btn-counter" onclick="adjustCount('child-count', -1)">-</button>
                    <input type="number" id="child-count" name="child-count" value="0" min="0" autocomplete="off" readonly>
                    <button type="button" class="btn-counter" onclick="adjustCount('child-count', 1)">+</button>
                </div>
                
                <div class="button-group">
                    <button type="button" class="btn-white" onclick="clearInput()">取り消し</button>
                    <button type="submit" class="btn-black">受 付</button>
                </div>
            </form>
        </div>

        <!-- ================= 結果表示エリア ================= -->
        <div id="result-area" class="hidden">
            <div id="result-message" class="result-message"></div>
            
            <div id="guest-info" class="guest-info-card hidden">
                <div class="info-row">
                    <span class="info-label">招待元企業名</span>
                    <span id="info-inviter"></span>
                </div>
                <div class="info-row customer-name">
                    <span id="info-customer"></span><span class="customer-name-suffix"> 様</span>
                </div>
                <div class="info-row">
                    <span class="info-label">お客様会社名</span>
                    <span id="info-company"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">特記事項</span>
                    <span id="info-note"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">来場人数</span>
                    <span id="info-guest-count"></span><span> 名</span>
                </div>
            </div>

            <div class="button-group">
                <button type="button" id="btn-re-reception" class="btn-white hidden" onclick="handleReReception()">受付取消</button>
                <button type="button" class="btn-black" onclick="resetScreen()">次の受付へ</button>
            </div>
        </div>
    </div>



    <script>
        let currentKeyNumber = '';

        function adjustCount(elementId, delta) {
            const input = document.getElementById(elementId);
            let currentValue = parseInt(input.value, 10) || 0;
            let newValue = currentValue + delta;
            if (newValue < 0) newValue = 0;
            input.value = newValue;
        }

        // ================= GAS API通信設定 =================
        // ここに新しくデプロイしたGASのWebアプリURL（https://script.google.com/.../exec）を貼り付けます
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwm6BVweEu-c2XpqayCqvRnCx0LITs8R7BOm8AWtigUhdUzHIcDAwP1qmD5mm6fwp_9VA/exec';

        async function fetchGasAPI(action, data) {
            if (WEB_APP_URL === 'ここにWebアプリのURLを貼り付けてください') {
                throw new Error('システム設定エラー: WEB_APP_URLが設定されていません。コードを編集してURLを入力してください。');
            }
            
            const payload = { action: action, ...data };
            const response = await fetch(WEB_APP_URL, {
                method: 'POST',
                // CORSのpreflightリクエストを回避するため、Content-Typeは明示的に設定しません（text/plainとして送信）
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                throw new Error('通信サーバーでエラーが発生しました。');
            }
            const result = await response.json();
            
            // GAS内でエラーが発生した場合（ロック取得失敗など）
            if (result.status === 'error') {
                throw new Error(result.message);
            }
            return result;
        }

        // ================= リアルタイムスキャナー処理 =================
        let videoStream = null;

        // 統合されたカメラスキャン起動処理
        function openScanner() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                openLiveScanner();
            } else {
                openCamera(); // 非対応の場合はファイル選択へフォールバック
            }
        }

        async function openLiveScanner() {
            const scannerContainer = document.getElementById('scanner-container');
            const videoElement = document.getElementById('live-video');
            const statusText = document.getElementById('scan-status-text');
            
            // UIのリセット
            const ocrResult = document.getElementById('live-ocr-result');
            if (ocrResult) {
                ocrResult.classList.add('hidden');
            }

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } }
                });
                
                scannerContainer.classList.remove('hidden');
                videoElement.srcObject = videoStream;
                videoElement.play();
                statusText.textContent = "キー番号を枠に合わせて「読み取り」を押してください";

            } catch (err) {
                console.error("Camera access error:", err);
                // 権限エラー等でカメラが開けなかった場合はファイル選択へフォールバック
                scannerContainer.classList.add('hidden');
                openCamera();
            }
        }

        function closeLiveScanner() {
            const scannerContainer = document.getElementById('scanner-container');
            scannerContainer.classList.add('hidden');
            
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        async function captureAndAnalyze() {
            const videoElement = document.getElementById('live-video');
            const canvas = document.getElementById('scan-canvas');
            const context = canvas.getContext('2d');
            const statusText = document.getElementById('scan-status-text');
            const guideBox = document.getElementById('scan-guide-box');

            if (!videoElement.videoWidth) return;

            statusText.textContent = "画像解析中...";
            document.getElementById('loading').innerText = '画像解析中...';
            document.getElementById('loading').classList.remove('hidden');

            try {
                // ガイド枠のサイズと位置を計算して、その部分だけを切り抜く
                const videoRect = videoElement.getBoundingClientRect();
                const guideRect = guideBox.getBoundingClientRect();

                // 実際のビデオの解像度と、画面上の表示サイズの比率を計算
                const scaleX = videoElement.videoWidth / videoRect.width;
                const scaleY = videoElement.videoHeight / videoRect.height;

                const cropX = (guideRect.left - videoRect.left) * scaleX;
                const cropY = (guideRect.top - videoRect.top) * scaleY;
                const cropW = guideRect.width * scaleX;
                const cropH = guideRect.height * scaleY;

                // Canvasを切り抜きサイズに設定
                canvas.width = cropW;
                canvas.height = cropH;
                
                // 切り抜き描画
                context.drawImage(videoElement, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);

                // GASのVision APIへ送信
                const response = await fetchGasAPI('processVision', {
                    base64Image: dataUrl
                });

                if (response.status === 'success' && response.text) {
                    document.getElementById('key-number').value = response.text;
                    closeLiveScanner();
                    document.getElementById('key-number').focus();
                } else {
                    alert(response.message || '文字を読み取れませんでした。枠に大きく映してもう一度お試しください。');
                    statusText.textContent = "キー番号を枠に合わせて「読み取り」を押してください";
                }
            } catch (err) {
                console.error("Vision API Error:", err);
                alert('読み取り処理中にエラーが発生しました: ' + err.message);
                statusText.textContent = "エラーが発生しました。もう一度お試しください";
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        // ================= 通知音の設定 =================
        // Googleドライブのファイルを直接再生するためのURL形式に変換して指定しています
        const soundSuccess = new Audio('data:audio/mp3;base64,SUQzAwAAAAAgVVdPQVIAAAAXAABodHRwczovL3BvY2tldC1zZS5pbmZvL1RBTEIAAAATAAAB//7dMLEwwzDIMLUwpjDzMMkwVElUMgAAAA0AAAH//rkwvzD8MMgw85cAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA         // iPad等のモバイルブラウザでの「音声再生ブロック」を解除するための初期化処理
        let isAudioUnlocked = false;
        function unlockAudio() {
            if (isAudioUnlocked) return;
            isAudioUnlocked = true;
            
            [soundSuccess, soundSpecial, soundError].forEach(audio => {
                audio.volume = 0; // 無音で一度再生してブロックを解除
                audio.play().then(() => {
                    audio.pause();
                    audio.currentTime = 0;
                    audio.volume = 1; // 音量を元に戻す
                }).catch(() => {
                    audio.volume = 1;
                });
            });
            
            // 一度解除したらイベントを削除
            document.removeEventListener('touchstart', unlockAudio);
            document.removeEventListener('click', unlockAudio);
        }
        
        // 画面のどこかをタッチまたはクリックした最初のタイミングでロック解除を実行
        document.addEventListener('touchstart', unlockAudio);
        document.addEventListener('click', unlockAudio);

        function playSound(audioElement) {
            if (!audioElement) return;
            // 他の音声を停止して競合を防ぐ
            [soundSuccess, soundSpecial, soundError].forEach(audio => {
                if (audio !== audioElement) {
                    audio.pause();
                    audio.currentTime = 0;
                }
            });
            
            audioElement.volume = 1;
            audioElement.currentTime = 0;
            audioElement.play().catch(function(e) {
                console.warn('音声の再生がブロックされました', e);
            });
        }

        /**
         * 受付処理の開始
         */
        async function handleReception(event) {
            event.preventDefault();
            
            // 音声の読み込みをユーザー操作直後に行い、非同期処理後の再生ブロックを防ぐ
            if (!isAudioUnlocked) {
                soundSuccess.load();
                soundSpecial.load();
                soundError.load();
                isAudioUnlocked = true;
            }

            const keyNumber = document.getElementById('key-number').value.trim();
            const companionCountRaw = document.getElementById('companion-count').value;
            const companionCount = parseInt(companionCountRaw, 10) || 0;
            const childCountRaw = document.getElementById('child-count').value;
            const childCount = parseInt(childCountRaw, 10) || 0;
            
            // 同伴者が0なら来場人数1、1なら2とする
            const guestCount = companionCount + 1;

            if (!keyNumber) {
                alert('キー番号を入力してください。');
                return;
            }

            currentKeyNumber = keyNumber;
            showLoading(true);

            try {
                // fetchを使ってGASのAPIにデータを送信
                const response = await fetchGasAPI('processReception', {
                    keyNumber: keyNumber,
                    guestCount: guestCount,
                    childCount: childCount
                });
                showResult(response);
            } catch (error) {
                // テストモード用フォールバック（設定忘れ時など）
                if (error.message.includes('システム設定エラー') && keyNumber === 'TEST') {
                    showResult({status: 'success', guest: {inviter: 'テスト', customer: '山田', company: 'テスト社', note: 'テストモード', guestCount: guestCount}});
                } else {
                    showError(error);
                }
            }
        }

        /**
         * 照合結果の画面・音声反映
         */
        function showResult(response) {
            showLoading(false);
            document.getElementById('input-area').classList.add('hidden');
            document.getElementById('result-area').classList.remove('hidden');
            
            const resultMessage = document.getElementById('result-message');
            const guestInfo = document.getElementById('guest-info');
            const btnReReception = document.getElementById('btn-re-reception');
            
            guestInfo.classList.add('hidden');
            btnReReception.classList.add('hidden');
            
            if (response.status === 'not_found') {
                document.body.className = 'status-error';
                resultMessage.textContent = '登録番号がありません';
                playSound(soundError);
            } 
            else if (response.status === 'success') {
                document.body.className = 'status-success';
                resultMessage.textContent = '受付完了';
                setGuestInfo(response.guest);
                guestInfo.classList.remove('hidden');
                
                if (response.guest.note && response.guest.note.trim() !== '') {
                    playSound(soundSpecial);
                } else {
                    playSound(soundSuccess);
                }
            } 
            else if (response.status === 'already_arrived') {
                document.body.className = 'status-warning';
                resultMessage.textContent = '来場済みです';
                setGuestInfo(response.guest);
                guestInfo.classList.remove('hidden');
                btnReReception.classList.remove('hidden');
                
                playSound(soundError);
            }
        }

        function setGuestInfo(guest) {
            document.getElementById('info-inviter').textContent = guest.inviter || '（未登録）';
            document.getElementById('info-customer').textContent = guest.customer || '（未登録）';
            document.getElementById('info-company').textContent = guest.company || '（未登録）';
            document.getElementById('info-note').textContent = guest.note || '（なし）';
            document.getElementById('info-guest-count').textContent = guest.guestCount || '1';
        }

        /**
         * 受付取消の処理（排他制御対応版）
         */
        async function handleReReception() {
            if (!confirm('受付を取り消して、未受付の状態に戻しますか？')) return;
            
            showLoading(true);
            try {
                const response = await fetchGasAPI('resetReception', {
                    keyNumber: currentKeyNumber
                });
                showLoading(false);
                if (response.status === 'reset_success') {
                    alert('受付を取り消しました。');
                    resetScreen(); // 入力画面に戻る
                } else {
                    alert('取り消し処理に失敗しました。: ' + (response.message || ''));
                    resetScreen();
                }
            } catch (error) {
                showError(error);
            }
        }

        function resetScreen() {
            document.body.className = '';
            document.getElementById('result-area').classList.add('hidden');
            document.getElementById('input-area').classList.remove('hidden');
            clearInput();
        }

        function clearInput() {
            const inputKey = document.getElementById('key-number');
            const inputCompanion = document.getElementById('companion-count');
            const inputChild = document.getElementById('child-count');
            
            inputKey.value = '';
            if (inputCompanion) inputCompanion.value = '0';
            if (inputChild) inputChild.value = '0';
            
            // iPad等のタブレットでソフトウェアキーボードが頻繁に出るのを防ぐため、
            // 意図的に自動フォーカス(input.focus())は外してあります。
            // ※外付けバーコードリーダーを使用する場合は自動フォーカスが必須になるため、必要に応じて `inputKey.focus();` を追加してください。
        }

        function showError(error) {
            showLoading(false);
            alert('通信エラーが発生しました。\n詳細: ' + error.message);
            resetScreen();
        }

        function showLoading(isShow) {
            document.getElementById('loading').classList.toggle('hidden', !isShow);
        }
        
        // ================= OCRカメラ処理 (iPad用) =================
        // ページ読み込み完了時にフォーカスを当てる
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('key-number').focus();
        });

        // カメラ（ファイル選択）を起動
        function openCamera() {
            document.getElementById('camera-file-input').click();
        }

        // 撮影された画像を処理
        async function handleImageCapture(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('loading').innerText = '画像解析中...';
            document.getElementById('loading').classList.remove('hidden');

            try {
                const img = new Image();
                img.onload = async () => {
                    // サイズを縮小して高速化
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // iPadの高解像度写真をそのまま処理すると重いため縮小する
                    // 同時に、写真の中央部分（横長）のみを切り抜いてOCRの精度を上げる
                    const MAX_WIDTH = 1200;
                    let imgW = img.width;
                    let imgH = img.height;
                    
                    // 縮小後のサイズを計算
                    let scale = 1;
                    if (imgW > MAX_WIDTH) {
                        scale = MAX_WIDTH / imgW;
                    }
                    let scaledW = imgW * scale;
                    let scaledH = imgH * scale;

                    // 切り抜く枠のサイズ（例: 幅の50%、高さは幅の25%のさらに狭い横長）
                    let cropW = scaledW * 0.5;
                    let cropH = cropW * 0.25;
                    
                    // 切り抜き開始位置（中央）
                    let cropX = (scaledW - cropW) / 2;
                    let cropY = (scaledH - cropH) / 2;

                    canvas.width = cropW;
                    canvas.height = cropH;
                    
                    // 元画像から中央部分だけをCanvasに描画
                    ctx.drawImage(img, cropX / scale, cropY / scale, cropW / scale, cropH / scale, 0, 0, cropW, cropH);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    
                    try {
                        const response = await fetchGasAPI('processVision', {
                            base64Image: dataUrl
                        });

                        if (response.status === 'success' && response.text) {
                            document.getElementById('key-number').value = response.text;
                            document.getElementById('key-number').focus();
                        } else {
                            alert(response.message || '文字を読み取れませんでした。キー番号を大きく映して、もう一度お試しください。');
                        }
                    } catch (apiErr) {
                        alert('読み取り処理中にエラーが発生しました。\n' + apiErr.message);
                        console.error(apiErr);
                    } finally {
                        document.getElementById('loading').innerText = '処理中...';
                        document.getElementById('loading').classList.add('hidden');
                        event.target.value = ''; // 次回も同じファイルを選べるようにリセット
                    }
                };
                img.onerror = () => {
                    alert('画像の読み込みに失敗しました。');
                    document.getElementById('loading').classList.add('hidden');
                    event.target.value = '';
                };
                img.src = URL.createObjectURL(file);
            } catch (err) {
                alert('処理中にエラーが発生しました。');
                console.error(err);
                document.getElementById('loading').classList.add('hidden');
                event.target.value = '';
            }
        }
    </script>
</body>
