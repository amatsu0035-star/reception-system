<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>来賓受付システム</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script>
        // ユーザー指定のGASウェブアプリURL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbw6Plcqp0nn42kWJQW8Sr5-QOhrQsi4rZ8N1xhmIA5GBAQTr06Nev1Dew5xdoGrXZQzUw/exec"; 

        async function callGas(action, keyNumber, guestCount = 0) {
            document.getElementById('loading').classList.remove('hidden');
            try {
                // GitHubからGASへデータを送信（fetch通信）
                await fetch(GAS_URL, {
                    method: "POST",
                    mode: "no-cors",
                    body: JSON.stringify({
                        action: action,
                        keyNumber: keyNumber,
                        guestCount: guestCount
                    })
                });
                // 送信完了後に成功画面を表示
                showSuccessScreen();
            } catch (e) {
                alert("通信エラーが発生しました。インターネット接続を確認してください。");
                console.error(e);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function showSuccessScreen() {
            document.getElementById('main-content').classList.add('hidden');
            document.getElementById('success-screen').classList.remove('hidden');
            document.body.style.backgroundColor = '#E8F5E9'; // 成功時は薄い緑色に
        }

        function processReception() {
            const key = document.getElementById('key-number').value;
            const count = document.getElementById('guest-count').value;
            if (!key) {
                alert('キー番号を入力してください');
                return;
            }
            callGas('processReception', key, count);
        }

        function resetReception() {
            const key = document.getElementById('key-number').value;
            if (!key) {
                alert('キー番号を入力してください');
                return;
            }
            if (confirm('この番号の受付を取り消しますか？')) {
                callGas('resetReception', key);
            }
        }

        function reloadApp() {
            location.reload();
        }

        // OCR（カメラ読み取り）処理
        async function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('loading').innerText = '解析中...';
            document.getElementById('loading').classList.remove('hidden');

            try {
                const worker = await Tesseract.createWorker('jpn');
                const ret = await worker.recognize(file);
                const text = ret.data.text.replace(/\D/g, ''); // 数字だけを抽出
                if (text) {
                    document.getElementById('key-number').value = text;
                } else {
                    alert("番号を読み取れませんでした。手動で入力してください。");
                }
                await worker.terminate();
            } catch (ocrErr) {
                alert('OCR処理中にエラーが発生しました。');
            } finally {
                document.getElementById('loading').innerText = '処理中...';
                document.getElementById('loading').classList.add('hidden');
            }
        }
    </script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Noto Sans JP', sans-serif; background-color: #F5F5F5; display: flex; justify-content: center; align-items: center; }
        .container { width: 90%; max-width: 450px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        h1 { font-size: 22px; color: #333; margin-bottom: 25px; }
        #camera-area { border: 2px dashed #d80c18; padding: 25px; margin-bottom: 25px; border-radius: 12px; cursor: pointer; background: #fff5f5; color: #d80c18; font-weight: bold; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 14px; font-weight: bold; color: #666; margin-bottom: 8px; }
        input, select { width: 100%; padding: 15px; font-size: 18px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; background: #fafafa; }
        .btn { width: 100%; padding: 18px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 15px; transition: opacity 0.2s; }
        .btn-primary { background-color: #d80c18; color: white; }
        .btn-secondary { background-color: #666; color: white; margin-top: 10px; font-size: 14px; }
        .hidden { display: none; }
        #loading { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #d80c18; z-index: 9999; }
    </style>
</head>
<body>
    <div id="loading" class="hidden">処理中...</div>

    <div id="main-content" class="container">
        <h1>来賓受付システム</h1>
        
        <div id="camera-area" onclick="document.getElementById('file-input').click()">
            📷 カメラでキー番号を読み取る
            <input type="file" id="file-input" accept="image/*" capture="environment" class="hidden" onchange="handleFile(event)">
        </div>

        <div class="input-group">
            <label>キー番号（手入力可）</label>
            <input type="text" id="key-number" inputmode="numeric" placeholder="例：1001">
        </div>
        <div class="input-group">
            <label>同伴人数</label>
            <select id="guest-count">
                <option value="0">同伴なし</option>
                <option value="1">1名</option>
                <option value="2">2名</option>
                <option value="3">3名</option>
                <option value="4">4名以上</option>
            </select>
        </div>

        <button class="btn btn-primary" onclick="processReception()">受付を完了する</button>
        <button class="btn btn-secondary" onclick="resetReception()">入力を間違えたので取り消す</button>
    </div>

    <div id="success-screen" class="container hidden">
        <div style="font-size: 60px; color: #4CAF50; margin-bottom: 20px;">✓</div>
        <h1 style="color: #2E7D32; margin-bottom: 10px;">受付が完了しました</h1>
        <p style="color: #666; margin-bottom: 30px;">スプレッドシートに記録されました。</p>
        <button class="btn btn-primary" onclick="reloadApp()">次の方を受け付ける</button>
    </div>
</body>
</html>
